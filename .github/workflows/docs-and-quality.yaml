name: Docs & Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Run Quality Checks (Linting & Tests)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          
          # Install app dependencies
          pip install -r requirements.txt
          if [ -f requirements-api.txt ]; then pip install -r requirements-api.txt; fi
          pip install -r requirements-dev.txt

          # Install linting tools explicitly
          python -m pip install --upgrade ruff black pytest

      - name: Ruff auto-fix 
        run: |
          set -euo pipefail
          ruff check . \
            --fix \
            --extend-ignore E402,B904 \
            --extend-exclude "CMaps,mlruns,artifacts,reports,reports_from_cluster,docs/_build,docs/build,.dvc,.ruff_cache,.pytest_cache,notebooks,cookiecutter"

      - name: Ruff format
        run: |
          set -euo pipefail
          ruff format . \
            --exclude "CMaps,mlruns,artifacts,reports,reports_from_cluster,docs/_build,docs/build,.dvc,.ruff_cache,.pytest_cache,notebooks,cookiecutter"

      - name: Black format
        run: |
          set -euo pipefail
          black . \
            --exclude '^(CMaps|mlruns|artifacts|reports|reports_from_cluster|docs/_build|docs/build|notebooks|cookiecutter|\.dvc)/'

      - name: Ruff lint
        run: |
          set -euo pipefail
          ruff check . \
            --output-format=github \
            --extend-ignore E402,B904 \
            --extend-exclude "CMaps,mlruns,artifacts,reports,reports_from_cluster,docs/_build,docs/build,.dvc,.ruff_cache,.pytest_cache,notebooks,cookiecutter"

      - name: Ruff format (verify)
        run: |
          set -euo pipefail
          ruff format --check . \
            --exclude "CMaps,mlruns,artifacts,reports,reports_from_cluster,docs/_build,docs/build,.dvc,.ruff_cache,.pytest_cache,notebooks,cookiecutter"

      - name: Black (verify)
        run: |
          set -euo pipefail
          black --check . \
            --exclude '^(CMaps|mlruns|artifacts|reports|reports_from_cluster|docs/_build|docs/build|notebooks|cookiecutter|\.dvc)/'

      - name: Tests
        run: |
          set -euo pipefail
          pytest -q

  # 2. Build Documentation 
  docs:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install doc dependencies
        run: |
          python -m pip install --upgrade pip
          # Explicitly install Sphinx and the Theme
          pip install sphinx sphinx-rtd-theme
          # Install project requirements so 'autodoc' can import your code
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-api.txt ]; then pip install -r requirements-api.txt; fi

      - name: Build HTML
        run: |
          set -euo pipefail
          
          # Build directly to 'docs_output' to avoid confusion with hidden '_build' folders
          sphinx-build -b html docs/source docs_output
          
          # CRITICAL FIX: Create .nojekyll so GitHub Pages serves '_static' CSS and '_modules' code
          touch docs_output/.nojekyll
          
          echo "Documentation built successfully."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_output

  # 3. Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4